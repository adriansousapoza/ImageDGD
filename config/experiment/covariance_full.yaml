# Experiment: GMM covariance-structure sweep (1 of 6 -- see covariance_diag,
# covariance_spherical, covariance_tied_full, covariance_tied_diag,
# covariance_tied_spherical for the rest of the same batch). Only
# model.gmm.covariance_type varies across the six; everything else
# (reg_covar, n_components, priors, ...) stays at config.yaml's defaults so
# the sweep isolates that one setting.
#
# "full": every component gets its own full n_features x n_features
# covariance matrix -- the most flexible parameterization (each cluster can
# be an arbitrarily oriented/shaped ellipsoid), and the most parameters to
# fit per component (n_features*(n_features+1)/2), so the most prone to
# overfitting/collapse on any one component with few points, and the
# slowest of the six to fit.
experiment_name: "ImageDGD_CovarianceFull"
description: "GMM covariance_type=full -- each component has its own full covariance matrix"

model:
  gmm:
    covariance_type: "full"

training:
  # Make sure the noise/latent progression gets generated throughout this run.
  plot_interval: 10
  inference:
    plot_interval: 10
