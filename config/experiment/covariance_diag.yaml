# Experiment: GMM covariance-structure sweep (2 of 6 -- see covariance_full
# for the shared rationale and the rest of the same batch: covariance_spherical,
# covariance_tied_full, covariance_tied_diag, covariance_tied_spherical).
#
# "diag": every component gets its own diagonal covariance (one variance per
# latent dimension, no cross-dimension correlation) -- axis-aligned
# ellipsoids, fewer parameters per component than "full" (n_features instead
# of n_features*(n_features+1)/2), cheaper to fit and less collapse-prone.
experiment_name: "ImageDGD_CovarianceDiag"
description: "GMM covariance_type=diag -- each component has its own diagonal (axis-aligned) covariance"

model:
  gmm:
    covariance_type: "diag"

training:
  plot_interval: 10
  inference:
    plot_interval: 10
