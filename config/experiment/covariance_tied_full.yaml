# Experiment: GMM covariance-structure sweep (4 of 6 -- see covariance_full
# for the shared rationale and the rest of the same batch: covariance_diag,
# covariance_spherical, covariance_tied_diag, covariance_tied_spherical).
#
# "tied_full": every component shares one full n_features x n_features
# covariance matrix (same shape/orientation ellipsoid everywhere, only the
# means differ) -- as flexible a *shape* as "full", but fit from all N
# points pooled across every component instead of each component's own
# (usually much smaller) share, so it's far less prone to any single
# component collapsing.
experiment_name: "ImageDGD_CovarianceTiedFull"
description: "GMM covariance_type=tied_full -- one shared full covariance matrix across all components"

model:
  gmm:
    covariance_type: "tied_full"

training:
  plot_interval: 10
  inference:
    plot_interval: 10
