# Default configuration for ImageDGD training
# This configuration provides reasonable defaults for production training

# General settings
random_seed: 42
experiment_name: "ImageDGD_Default"
description: "Default ImageDGD training configuration"

# Filesystem root for timestamped experiment run folders. Notebooks overwrite
# this with an absolute path derived from project_root at runtime (same
# pattern as data.root_dir), then resolve config.paths.models_dir/figures_dir
# to point inside that run's own timestamped folder before training/inference
# starts, so no run ever overwrites another's checkpoints or figures.
paths:
  experiments_dir: "./experiments"

# Data configuration
data:
  dataset_name: "FashionMNIST"
  root_dir: "./data"
  batch_size: 256
  num_workers: 4
  pin_memory: true
  total_subset_fraction: 1.0
  val_split: 0.1
  test_split: 0.1
  download: true
  shuffle_train: true
  shuffle_val: false
  shuffle_test: false

  # Data transforms
  transforms:
    train: ['ToTensor']
    val: ['ToTensor']
    test: ['ToTensor']
  
  # Class names for FashionMNIST
  class_names:
    - 'Ankle boot'
    - 'Bag'
    - 'Coat'
    - 'Dress'
    - 'Pullover'
    - 'Sandal'
    - 'Shirt'
    - 'Sneaker'
    - 'T-shirt/top'
    - 'Trouser'
  
# Model configuration
model:
  # Representation layer configuration
  representation:
    n_features: 8
    distribution: "zeros"  # Options: normal, uniform, uniform_ball, uniform_sphere, laplace, student_t, logistic, hyperbolic, zeros, pca
    dist_params: {}
    # Distribution-specific parameters examples:
    # {'radius': 1.0} # uniform_ball
    # {'radius': 1.0} # uniform_sphere
    # {'mean': 0, 'cov': 1} # normal
    # {'low': -1.0, 'high': 1.0} # uniform
    # {'loc': 0, 'scale_matrix': 1, 'rate': 1.0} # laplace
    # {'df': 3.0, 'scale_matrix': 1} # student_t
    # {'loc': 0, 'scale': 1} # logistic
    # {'mu': 0, 'alpha': 1.5, 'beta': 0.0, 'delta': 1.0} # hyperbolic
    # {} # zeros
    # {'whiten': false, 'svd_solver': 'auto'} # pca (requires data at runtime)
  
  # Decoder configuration
  decoder:
    hidden_dims: [128, 64]
    output_channels: 1
    output_size: [28, 28]
    init_size: [7, 7]
    kernel_size: 3
    stride: 2
    padding: 1
    output_padding: 1
    normalization: "batch"
    activation: "leaky_relu"
    final_activation: "sigmoid"
    dropout_rate: 0.0
    upsampling_mode: "nearest"
  
  # GMM configuration
  gmm:
    n_components: 20
    n_features: null # If null, uses representation n_features
    covariance_type: "tied_spherical"
    max_iter: 1000
    tol: 1e-4
    reg_covar: 1e-6
    n_init: 1
    init_means: "kmeans"
    init_weights: "uniform"
    init_covariances: "empirical"
    warm_start: true
    cem: false
    weight_concentration_prior: null
    mean_prior: null
    mean_precision_prior: null
    covariance_prior: null
    degrees_of_freedom_prior: null
    verbose: false
    verbose_interval: 10

# Training configuration
training:
  epochs: 200
  device: "auto"
  
  # Early stopping. Active from first_epoch_gmm onward; the GMM prior
  # introduces per-refit val-loss noise (observed ~30-epoch oscillations
  # around refit points), so patience needs enough margin to not mistake
  # that noise for a genuine plateau.
  early_stopping_patience: null
  
  # GMM training schedule
  first_epoch_gmm: 50
  refit_gmm_interval: 50
  lambda_gmm: 1.0
  final_gmm_fit: false

  # Latent space noise injection (regularization)
  latent_noise_enabled: true  # Enable noise injection
  latent_noise_start: 1.0  # Starting noise scale (epoch 1)
  latent_noise_end: 0.01     # Ending noise scale (final epoch)

  # Post-hoc inference (Algorithm 2): optimizing representations for the
  # held-out test split against a frozen decoder + GMM. M0 (prior_warmup_steps)
  # must be < epochs — a fresh z far from every mode is dominated by the prior
  # gradient before reconstruction has informed it where to go; a short
  # reconstruction-only warm-up lets it find its basin first.
  inference:
    epochs: 400            # M: total optimization steps
    prior_warmup_steps: ${training.first_epoch_gmm} # M0: steps before the GMM prior term is added
    # Mirrors the top-level latent_noise_enabled/_start/_end above via
    # OmegaConf interpolation, so inference uses the exact same noise
    # settings training did by default. Override any of these three lines
    # with a literal value to make inference's noise independently tunable
    # again -- interpolation only applies while the field is left as ${...}.
    latent_noise_enabled: ${training.latent_noise_enabled}  # Enable noise injection
    latent_noise_start: ${training.latent_noise_start}  # Starting noise scale (step 1)
    latent_noise_end: ${training.latent_noise_end}     # Ending noise scale (final step M)

  # Optimizer configuration (AdamW)
  optimizer:
    decoder:
      lr: 0.01
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1e-8
      amsgrad: false
    representation:
      lr: 0.1
      weight_decay: 0
      betas: [0.9, 0.999]
      eps: 1e-8
      amsgrad: false
  
  # Learning rate scheduler (cosine annealing, no warm-up/restarts: a plain
  # decay from base_lr to final_lr over the full training run)
  lr_scheduler:
    enabled: true
    base_lr_decoder: 0.01          # Starting LR for decoder (if null, uses optimizer.decoder.lr)
    final_lr_decoder: 0.001       # Ending LR for decoder
    base_lr_representation: 0.1    # Starting LR for representations (if null, uses optimizer.representation.lr)
    final_lr_representation: 0.01 # Ending LR for representations
